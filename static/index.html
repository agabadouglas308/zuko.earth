<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Elgon-Victoria Hazard Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/static/style.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="map"></div>

  <div id="status">
    <strong>Elgon-Victoria Hazard Dashboard</strong>
    <div id="last-updated">last updated: loading…</div>
    <div id="source"></div>
    <button id="btn-check-alerts" onclick="triggerAlerts()">Check Alerts</button>
    <button id="btn-demo" onclick="loadDemo()">Load Demo Data</button>
  </div>

  <div id="legend">
    <div class="legend-row"><span class="sw" style="background:#22c55e"></span>Low</div>
    <div class="legend-row"><span class="sw" style="background:#f59e0b"></span>Medium</div>
    <div class="legend-row"><span class="sw" style="background:#ef4444"></span>High</div>
    <div class="legend-note">Rule-based score: 0.5*1d + 0.3*3d + 0.2*7d rainfall</div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
